name: Keep Supabase awake
# Supabase Free pauses a project after 7 days without activity. /api/health runs a real query
# against the catalog table and returns 200 only when the database answered.
on:
  schedule:
    - cron: "23 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the health check
        run: curl -sf https://sillage-rosy.vercel.app/api/health
