name: Refresh the catalog
# Monthly (DEC-56): rebuild the catalog from the open Decant dataset and load it into production.
# An unchanged dataset is detected by its version and skipped; unverified Open Beauty Facts entries
# are merged into full entries on every run. Logs show counts only, never what users searched for.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL               the project URL (https://<ref>.supabase.co)
#   SUPABASE_SERVICE_ROLE_KEY  the service-role key (Supabase → Project settings → API keys)
on:
  schedule:
    - cron: "17 6 3 * *" # 06:17 UTC on the 3rd of each month
  workflow_dispatch:
    inputs:
      force:
        description: "Reload even if the dataset version hasn't changed"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Check the secrets are set
        id: secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY secrets are not set; skipping the refresh."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the catalog from the dataset
        if: steps.secrets.outputs.ready == 'true'
        run: npm run catalog:build
      - name: Load it, merge unverified entries, log the refresh
        if: steps.secrets.outputs.ready == 'true'
        run: npm run catalog:load -- ${{ inputs.force && '--force' || '' }}
      - name: Summary
        if: steps.secrets.outputs.ready == 'true'
        run: |
          echo "### Catalog refresh" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat .data/catalog-meta.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
